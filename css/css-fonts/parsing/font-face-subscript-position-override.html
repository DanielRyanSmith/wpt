<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Fonts 5: Support for subscript-position-override descriptor in @font-face</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-5/#descdef-font-face-subscript-position-override">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style id="testStyle"></style>
<script>
  const sheet = testStyle.sheet;

  test(() => {
    assert_equals(sheet.cssRules.length, 0, "testStyle sheet should initially be empty");
    sheet.insertRule(`@font-face { subscript-position-override: 10%; }`);
    try {
      const rule = sheet.cssRules[0];
      assert_equals(rule.style.getPropertyValue("subscript-position-override"), "10%");
    } finally {
      sheet.deleteRule(0);
    }
  }, "The @font-face rule must support the subscript-position-override descriptor with percentage value");

  test(() => {
    assert_equals(sheet.cssRules.length, 0, "testStyle sheet should initially be empty");
    sheet.insertRule(`@font-face { subscript-position-override: normal; }`);
    try {
      const rule = sheet.cssRules[0];
      assert_equals(rule.style.getPropertyValue("subscript-position-override"), "normal");
    } finally {
      sheet.deleteRule(0);
    }
  }, "The @font-face rule must support the subscript-position-override descriptor with normal value");
</script>
