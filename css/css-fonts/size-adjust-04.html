<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Fonts 5: size-adjust scales font metrics and glyphs</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-5/#descdef-font-face-size-adjust">
<link rel="match" href="size-adjust-04-ref.html">
<meta name="assert" content="The `size-adjust` descriptor must scale all metrics associated with the font (including glyph advances, baseline tables, and overrides) and the rendered glyph images by the specified percentage.">
<style>
@font-face {
  font-family: normal-font;
  src: local(Ahem), url(/fonts/Ahem.ttf);
}

@font-face {
  font-family: adjusted-font;
  src: local(Ahem), url(/fonts/Ahem.ttf);
  size-adjust: 50%;
}

div {
  line-height: 200px;
  margin-bottom: 20px;
}

.normal {
  font-family: normal-font, sans-serif;
  font-size: 100px;
}

.adjusted {
  font-family: adjusted-font, sans-serif;
  font-size: 200px;
}
</style>
<body>
  <div class="normal">X X X</div>
  <div class="adjusted">X X X</div>
</body>
