<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Fonts Test: font-size-adjust applied after size-adjust</title>
<link rel="help" href="https://drafts.csswg.org/css-fonts-5/#font-size-adjust-prop">
<link rel="help" href="https://drafts.csswg.org/css-fonts-5/#descdef-font-face-size-adjust">
<meta name="assert" content="The font-size-adjust property must be applied after the size-adjust descriptor.">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<style>
@font-face {
  font-family: 'custom-adjusted';
  src: url('/fonts/Ahem.ttf');
  size-adjust: 50%;
}
@font-face {
  font-family: 'custom-normal';
  src: url('/fonts/Ahem.ttf');
}

.adjusted-test {
  font-family: 'custom-adjusted', sans-serif;
  font-size: 100px;
  font-size-adjust: 0.5;
}
.normal-test {
  font-family: 'custom-normal', sans-serif;
  font-size: 100px;
  font-size-adjust: 0.5;
}
#adjusted-box {
  width: 10ex;
  height: 10ex;
  display: inline-block;
}
#normal-box {
  width: 10ex;
  height: 10ex;
  display: inline-block;
}
</style>
<body>
<div style="visibility: hidden; position: absolute;">
  <span class="adjusted-test">x</span>
  <span class="normal-test">x</span>
</div>

<div class="adjusted-test">
  <div id="adjusted-box"></div>
</div>
<div class="normal-test">
  <div id="normal-box"></div>
</div>

<script>
promise_test(async () => {
  await document.fonts.ready;

  const adjustedBox = document.getElementById('adjusted-box');
  const normalBox = document.getElementById('normal-box');

  const adjustedRect = adjustedBox.getBoundingClientRect();
  const normalRect = normalBox.getBoundingClientRect();

  // If font-size-adjust applies AFTER size-adjust, the adjusted aspect value a' is scaled.
  // The final adjusted font size will compensate for size-adjust, making the final ex-height
  // strictly determined by font-size-adjust * font-size.
  // Therefore, both boxes should have exactly the same ex-height (which is 0.5 * 100px = 50px).
  assert_equals(adjustedRect.height, normalRect.height, 'ex units should be identical because font-size-adjust normalizes the ex-height');
  assert_equals(adjustedRect.height, 500, 'ex height should equal font-size * font-size-adjust * 10');
}, 'font-size-adjust applies after size-adjust');

promise_test(async () => {
  await document.fonts.ready;
  const adjustedBox = document.getElementById('adjusted-box');
  const exHeight = adjustedBox.getBoundingClientRect().height / 10;
  // 100px font size * 0.5 font-size-adjust = 50px ex height
  assert_equals(exHeight, 50, 'The final size should reflect font-size-adjust applied on top of the size-adjust scaled metrics.');
}, 'font-size-adjust applied after size-adjust (Integration)');
</script>
</body>
